<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Интернет-магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'catalog' %}">🛍 Магазин</a>
            <div class="d-flex gap-2 align-items-center">
                <a href="{% url 'cart_detail' %}" class="btn btn-outline-light btn-sm position-relative">
                    Корзина
                    <span id="cart-badge" class="badge bg-danger position-absolute top-0 start-100 translate-middle">
                        {{ request.session.cart|length }}
                    </span>
                </a>
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="btn btn-outline-light btn-sm">Профиль</a>
                    <form method="post" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Войти</a>
                    <a href="{% url 'register' %}" class="btn btn-outline-light btn-sm">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
